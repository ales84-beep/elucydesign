(function () {
  const requiredPin = "1206";
  const storageKey = "elucyPinUnlocked";

  try {
    if (sessionStorage.getItem(storageKey) === "yes") {
      return;
    }
  } catch (error) {
    // If sessionStorage is blocked, the PIN gate still works for this load.
  }

  const style = document.createElement("style");
  style.id = "elucy-pin-style";
  style.textContent = `
    html.elucy-pin-locked body > :not(.elucy-pin-gate) {
      visibility: hidden !important;
    }

    .elucy-pin-gate {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        linear-gradient(135deg, rgba(156, 225, 209, 0.86), rgba(255, 255, 255, 0.95)),
        #ffffff;
      font-family: "Inter", "Segoe UI", Arial, sans-serif;
      color: #1f2c2f;
    }

    .elucy-pin-box {
      width: min(360px, 100%);
      padding: 28px;
      border: 1px solid rgba(47, 127, 115, 0.18);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 18px 50px rgba(31, 44, 47, 0.14);
      text-align: center;
    }

    .elucy-pin-logo {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.04em;
    }

    .elucy-pin-logo span {
      color: #7c5f45;
      font-family: "Caveat", "Segoe Script", cursive;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .elucy-pin-box p {
      margin: 0 0 18px;
      color: #5b6b72;
      font-size: 14px;
      line-height: 1.5;
    }

    .elucy-pin-form {
      display: grid;
      gap: 12px;
    }

    .elucy-pin-input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px 14px;
      border: 1px solid rgba(47, 127, 115, 0.24);
      border-radius: 10px;
      font-size: 20px;
      font-weight: 800;
      text-align: center;
      letter-spacing: 0.25em;
      color: #1f2c2f;
      outline: none;
    }

    .elucy-pin-input:focus {
      border-color: #2f7f73;
      box-shadow: 0 0 0 4px rgba(156, 225, 209, 0.4);
    }

    .elucy-pin-button {
      min-height: 46px;
      border: 0;
      border-radius: 10px;
      background: #9ce1d1;
      color: #1f2c2f;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
    }

    .elucy-pin-error {
      min-height: 18px;
      color: #b42318;
      font-size: 13px;
      font-weight: 800;
    }
  `;

  document.documentElement.classList.add("elucy-pin-locked");
  document.head.appendChild(style);

  function unlock(gate) {
    try {
      sessionStorage.setItem(storageKey, "yes");
    } catch (error) {
      // Continue without storage.
    }

    document.documentElement.classList.remove("elucy-pin-locked");
    gate.remove();
    style.remove();
  }

  function createGate() {
    const gate = document.createElement("div");
    gate.className = "elucy-pin-gate";
    gate.innerHTML = `
      <div class="elucy-pin-box" role="dialog" aria-modal="true" aria-labelledby="elucy-pin-title">
        <h1 class="elucy-pin-logo" id="elucy-pin-title">ELUCY <span>design</span></h1>
        <p>Za predogled vnesi 4-mestni PIN.</p>
        <form class="elucy-pin-form">
          <input class="elucy-pin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="PIN koda">
          <button class="elucy-pin-button" type="submit">Vstopi</button>
          <div class="elucy-pin-error" aria-live="polite"></div>
        </form>
      </div>
    `;

    const form = gate.querySelector(".elucy-pin-form");
    const input = gate.querySelector(".elucy-pin-input");
    const error = gate.querySelector(".elucy-pin-error");

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      if (input.value === requiredPin) {
        unlock(gate);
        return;
      }

      input.value = "";
      error.textContent = "Napačen PIN.";
      input.focus();
    });

    document.body.appendChild(gate);
    input.focus();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", createGate, { once: true });
  } else {
    createGate();
  }
})();
